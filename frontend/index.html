<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Subtitle Studio</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf7;background:#0c1220}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #344158;color:#e5efff;background:#1b2942;padding:10px 14px;border-radius:9px}button:hover{background:#2a4061}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#1976d2;border-color:#278bf0}.primary:hover{background:#1f86ea}header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid #263148;background:#11192a}.brand{font-weight:800;font-size:20px;letter-spacing:-.4px}.brand span{color:#67c3ff}.badge{background:#163d31;color:#8be2b1;border:1px solid #25664c;padding:6px 9px;border-radius:20px;font-size:12px}main{max-width:1450px;margin:auto;padding:26px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.muted{color:#94a3b8;font-size:13px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px}.panel{background:#141e31;border:1px solid #2b3850;border-radius:14px;overflow:hidden}.panel .heading{font-weight:700;padding:16px;border-bottom:1px solid #2b3850}.list{padding:10px;max-height:65vh;overflow:auto}.project{display:block;width:100%;padding:13px;text-align:left;margin-bottom:8px;background:#1a263b}.project.active{border-color:#57b5fa;background:#203451}.project .name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project small{display:block;margin-top:6px;color:#9daec7}.work{padding:20px}.player{width:100%;background:#070b12;max-height:410px;aspect-ratio:16/7;border-radius:11px;object-fit:contain}.controls{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:15px 0;flex-wrap:wrap}.controls .group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{background:#27364f;color:#d9e8ff;border-radius:9px;padding:12px;margin-bottom:16px}.error{background:#4a202c;color:#ffbfc7}.editor{overflow:auto;max-height:64vh}.cue{display:grid;grid-template-columns:135px minmax(180px,1fr) minmax(180px,1fr) 75px;gap:10px;align-items:start;padding:13px;border-bottom:1px solid #2d394f}.cue.active{background:#20314e}.cue .time input{width:100%;margin:3px 0;background:#0d172a;border:1px solid #314057;border-radius:6px;padding:7px;color:#c4d9f7;font-size:12px}.cue textarea{width:100%;min-height:74px;resize:vertical;background:#0d172a;border:1px solid #34425c;color:#eff4ff;padding:10px;border-radius:8px;line-height:1.5;font-size:14px}.cue textarea:focus,.cue input:focus{outline:2px solid #2683d3}.status{font-size:12px;white-space:nowrap}.status.ready{color:#73deb3}.status.failed{color:#ff8495}.pill{background:#243855;padding:4px 8px;border-radius:12px}.empty{padding:60px 20px;text-align:center;color:#a3b5ce}h1,h2{margin:0 0 7px}h1{font-size:26px}h2{font-size:17px}.tiny{font-size:11px;color:#9baac2}.progress{height:5px;border-radius:5px;background:#2c3850;margin-top:9px;overflow:hidden}.progress span{display:block;height:100%;background:#4eacec}.fileinput{display:none}#upload{display:inline-block}.footer{padding:12px 17px;border-top:1px solid #293851;color:#8e9db6;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.cue{grid-template-columns:1fr 1fr}.cue .time{grid-column:1/3}.cue .save{grid-column:2}.work{padding:12px}header{padding:15px}}
</style></head><body><header><div class="brand">▣ <span>Subtitle</span> Studio</div><div class="badge">● Procesamiento local</div></header><main><div class="top"><div><h1>Proyectos</h1><div class="muted">Transcribe, traduce y edita subtítulos sin subirlos a la nube.</div></div><div><label class="primary" id="upload" style="padding:11px 16px;border-radius:9px;cursor:pointer">＋ Añadir vídeo<input id="file" type="file" class="fileinput" accept="video/*,audio/*,.mkv,.flac"/></label></div></div><div class="layout"><aside class="panel"><div class="heading">Biblioteca</div><div class="list" id="projects">Cargando...</div><div class="footer">Qwen3-ASR · MLX · Ollama</div></aside><section class="panel"><div class="work"><div id="workspace"><div class="empty">Selecciona un proyecto o sube un vídeo para empezar.</div></div></div></section></div></main><script>
let projects=[],selected=null,detail=null,dirty=new Set(),busy=false;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts){const r=await fetch(url,opts);if(!r.ok){let v;try{v=await r.json()}catch{}throw Error(v?.detail||`Error HTTP ${r.status}`)}return r.headers.get('content-type')?.includes('application/json')?r.json():r.text()}
async function refresh(){try{projects=await api('/api/projects');renderList();if(selected&&!busy&&dirty.size===0){let newDetail=await api(`/api/projects/${selected}`);const prev=detail?.project?.state;detail=newDetail;if(prev!==detail.project.state||detail.project.state!=='ready')renderWorkspace();}}catch(e){$('projects').textContent=e.message}}
function renderList(){$('projects').innerHTML=projects.length?projects.map(p=>`<button class="project ${selected===p.id?'active':''}" data-id="${p.id}"><div class="name">${esc(p.name)}</div><small>${esc(p.state)} · ${p.progress}%</small><div class="progress"><span style="width:${p.progress}%"></span></div></button>`).join(''):'<div class="empty">Aún no hay proyectos.</div>';document.querySelectorAll('.project').forEach(b=>b.onclick=()=>select(b.dataset.id))}
async function select(pid){if(dirty.size&&!confirm('Hay cambios sin guardar. ¿Cambiar de proyecto?'))return;selected=pid;dirty.clear();renderList();detail=await api(`/api/projects/${pid}`);renderWorkspace()}
const time=t=>{t=Math.max(0,Number(t)||0);let h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=(t%60).toFixed(3).padStart(6,'0');return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${s}`};
const secs=s=>{let a=s.trim().replace(',','.').split(':');return a.length===3?(+a[0]*3600)+(+a[1]*60)+(+a[2]):NaN};
function renderWorkspace(){if(!detail)return;let p=detail.project,cues=detail.cues;const ready=p.state==='ready';$('workspace').innerHTML=`<div class="top"><div><h2>${esc(p.name)}</h2><span class="status ${esc(p.state)}">Estado: ${esc(p.state)} · ${p.progress}%</span></div>${ready?'<div class="group"><select id="language"><option value="es">Español</option><option value="original">Original</option></select><select id="format"><option>srt</option><option>vtt</option></select><button id="export" class="primary">Exportar</button></div>':''}</div>${p.error?`<div class="notice error">${esc(p.error)}</div>`:''}<video id="video" class="player" controls preload="metadata" src="/api/projects/${p.id}/media"></video><div class="controls"><span class="muted">${cues.length} segmentos · Original y español</span><span class="tiny">Los cambios se guardan por segmento.</span></div>${ready?`<div class="cue tiny" style="border-top:1px solid #2d394f"><div>TIEMPOS</div><div>TEXTO ORIGINAL</div><div>TRADUCCIÓN AL ESPAÑOL</div><div>GUARDAR</div></div><div class="editor" id="editor">${cues.map((c,i)=>`<div class="cue" data-cue="${c.id}" data-start="${c.start}" data-end="${c.end}"><div class="time"><span class="tiny">#${i+1}</span><input aria-label="Inicio" class="start" value="${time(c.start)}"><input aria-label="Fin" class="end" value="${time(c.end)}"></div><textarea class="original" aria-label="Original">${esc(c.original)}</textarea><textarea class="translated" aria-label="Español">${esc(c.translated)}</textarea><div class="save"><button class="savebtn" disabled>Guardar</button></div></div>`).join('')}</div>`:'<div class="notice">El trabajo se actualizará automáticamente. Para la primera ejecución, los modelos deben estar descargados.</div>'}`;
if(ready){$('export').onclick=()=>{location.href=`/api/projects/${p.id}/export?language=${$('language').value}&format=${$('format').value}`};document.querySelectorAll('.cue[data-cue]').forEach(row=>{row.querySelectorAll('input,textarea').forEach(el=>el.oninput=()=>{dirty.add(row.dataset.cue);row.querySelector('.savebtn').disabled=false});row.querySelector('.savebtn').onclick=()=>saveCue(row);row.ondblclick=e=>{if(['TEXTAREA','INPUT','BUTTON'].includes(e.target.tagName))return;$('video').currentTime=+row.dataset.start;$('video').play()}});$('video').ontimeupdate=()=>{let t=$('video').currentTime;document.querySelectorAll('.cue[data-cue]').forEach(row=>row.classList.toggle('active',t>=+row.dataset.start&&t<+row.dataset.end))}}
}
async function saveCue(row){let id=row.dataset.cue;let start=secs(row.querySelector('.start').value),end=secs(row.querySelector('.end').value);if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start){alert('Tiempos incorrectos. Usa HH:MM:SS.mmm');return}const btn=row.querySelector('.savebtn');btn.disabled=true;btn.textContent='Guardando';busy=true;try{await api(`/api/projects/${selected}/cues/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({start,end,original:row.querySelector('.original').value,translated:row.querySelector('.translated').value})});row.dataset.start=start;row.dataset.end=end;dirty.delete(id);btn.textContent='Guardado ✓';setTimeout(()=>{btn.textContent='Guardar'},1400)}catch(e){btn.textContent='Reintentar';btn.disabled=false;alert(e.message)}finally{busy=false}}
async function uploadFile(e){let f=e.target.files[0];if(!f)return;let d=new FormData();d.append('file',f);const label=$('upload');label.textContent='Subiendo…';try{const r=await api('/api/projects',{method:'POST',body:d});await refresh();await select(r.id)}catch(err){alert(err.message)}finally{label.innerHTML='＋ Añadir vídeo<input id="file" type="file" class="fileinput" accept="video/*,audio/*,.mkv,.flac"/>';label.querySelector('input').onchange=uploadFile;}}
$('file').onchange=uploadFile;
refresh();setInterval(refresh,4000);
</script></body></html>
