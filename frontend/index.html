<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Subtitle Studio</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #e8edf7;
        background: #0c1220;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid #344158;
        color: #e5efff;
        background: #1b2942;
        padding: 10px 14px;
        border-radius: 9px;
      }
      button:hover {
        background: #2a4061;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .primary {
        background: #1976d2;
        border-color: #278bf0;
      }
      .primary:hover {
        background: #1f86ea;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 32px;
        border-bottom: 1px solid #263148;
        background: #11192a;
      }
      .brand {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.4px;
      }
      .brand span {
        color: #67c3ff;
      }
      .badge {
        background: #163d31;
        color: #8be2b1;
        border: 1px solid #25664c;
        padding: 6px 9px;
        border-radius: 20px;
        font-size: 12px;
      }
      main {
        width: 100%;
        margin: auto;
        padding: 26px 24px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }
      .muted {
        color: #94a3b8;
        font-size: 13px;
      }
      .layout {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 22px;
      }
      .panel {
        background: #141e31;
        border: 1px solid #2b3850;
        border-radius: 14px;
        overflow: hidden;
      }
      .panel .heading {
        font-weight: 700;
        padding: 16px;
        border-bottom: 1px solid #2b3850;
      }
      .audio-sample {
        display: grid;
        gap: 6px;
        margin: 12px 0;
        justify-items: start;
      }
      .audio-sample audio {
        max-width: 100%;
      }
      .subtitle-preview {
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #4a6185;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .subtitle-preview ol {
        margin-bottom: 0;
        max-height: 45vh;
        overflow: auto;
      }
      .preview-segment {
        display: block;
        width: 100%;
        padding: 5px 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        text-align: left;
        white-space: pre-wrap;
      }
      .library-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 10px;
      }
      .library-actions button {
        font-size: 12px;
        padding: 7px 9px;
      }
      .list {
        padding: 10px;
        max-height: 65vh;
        overflow: auto;
      }
      .project {
        display: block;
        width: 100%;
        padding: 13px;
        text-align: left;
        margin-bottom: 8px;
        background: #1a263b;
      }
      .project.active {
        border-color: #57b5fa;
        background: #203451;
      }
      .project .name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .project small {
        display: block;
        margin-top: 6px;
        color: #9daec7;
      }
      .work {
        padding: 20px;
      }
      .player-video {
        position: relative;
      }
      .video-subtitles {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 16%;
        text-align: center;
        color: #fff;
        font-size: clamp(16px, 2vw, 26px);
        font-weight: 650;
        line-height: 1.35;
        text-shadow:
          0 1px 3px #000,
          0 0 6px #000;
        white-space: pre-wrap;
        pointer-events: none;
      }
      .player {
        width: 100%;
        background: #070b12;
        
        aspect-ratio: 16/7;
        border-radius: 11px;
        object-fit: contain;
      }
      .controls {
        display: flex;
        gap: 9px;
        align-items: center;
        justify-content: space-between;
        margin: 15px 0;
        flex-wrap: wrap;
      }
      .controls .group {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .notice {
        background: #27364f;
        color: #d9e8ff;
        border-radius: 9px;
        padding: 12px;
        margin-bottom: 16px;
      }
      .error {
        background: #4a202c;
        color: #ffbfc7;
      }
      .editor {
        overflow: auto;
        
      }
      .subtitle-table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .number-col {
        width: 42px;
      }
      .time-col {
        width: 120px;
      }
      .subtitle-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #1b2942;
        text-align: left;
        font-size: 12px;
        padding: 12px 8px;
      }
      .subtitle-table td {
        padding: 8px;
        border-bottom: 1px solid #2d394f;
        vertical-align: top;
      }
      .cue-number {
        color: #94a3b8;
        font-size: 12px;
        padding-top: 18px !important;
      }
      .editor-toolbar,
      .editor-toolbar .group {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .editor-toolbar {
        justify-content: space-between;
      }
      #save-status {
        font-size: 12px;
        color: #94d9bd;
      }
      #save-status.save-error {
        color: #ffadb7;
      }
      [aria-invalid="true"] {
        border-color: #ff8495 !important;
      }
      .cue.active {
        background: #20314e;
      }
      .cue input {
        width: 100%;
        margin: 3px 0;
        background: #0d172a;
        border: 1px solid #314057;
        border-radius: 6px;
        padding: 7px;
        color: #c4d9f7;
        font-size: 12px;
      }
      .cue textarea {
        width: 100%;
        min-height: 74px;
        resize: vertical;
        background: #0d172a;
        border: 1px solid #34425c;
        color: #eff4ff;
        padding: 10px;
        border-radius: 8px;
        line-height: 1.5;
        font-size: 14px;
      }
      .cue textarea:focus,
      .cue input:focus {
        outline: 2px solid #2683d3;
      }
      .status {
        font-size: 12px;
        white-space: nowrap;
      }
      .status.ready {
        color: #73deb3;
      }
      .status.failed {
        color: #ff8495;
      }
      .pill {
        background: #243855;
        padding: 4px 8px;
        border-radius: 12px;
      }
      .empty {
        padding: 60px 20px;
        text-align: center;
        color: #a3b5ce;
      }
      h1,
      h2 {
        margin: 0 0 7px;
      }
      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 17px;
      }
      .tiny {
        font-size: 11px;
        color: #9baac2;
      }
      .progress {
        height: 5px;
        border-radius: 5px;
        background: #2c3850;
        margin-top: 9px;
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        background: #4eacec;
      }
      .fileinput {
        display: none;
      }
      #upload {
        display: inline-block;
      }
      .footer {
        padding: 12px 17px;
        border-top: 1px solid #293851;
        color: #8e9db6;
        font-size: 12px;
      }
      @media (max-width: 850px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .work {
          padding: 12px;
        }
        header {
          padding: 15px;
        }
      }
      .topbar { height: 40px; padding: 0 10px; gap: 10px; justify-content: flex-start; }
      .topbar .brand { font-size: 14px; color: #67c3ff; }
      .topbar #project-header { flex: 1; min-width: 0; }
      .topbar .badge { font-size: 11px; padding: 2px 8px; white-space: nowrap; }
      .topbar button { padding: 4px 8px; font-size: 12px; white-space: nowrap; }
      main { padding: 0; }
      .library { display:flex; flex-direction:column; }
      .library-footer { display:flex; gap: 10px; padding: 8px; border-top: 1px solid #263148; }
      .library-footer button { border:0; background:transparent; padding:0; font-size:11px; color:#94a3b8; }
      .layout { display:block; position:relative; }
      .library { position:absolute; z-index:5; top:0; bottom:0; left:0; width:232px; border-radius:0; box-shadow:18px 0 44px -18px #000; }
      .library-collapsed .library { display:none; }
      .library .list { flex:1; max-height:none; }
      .project { display:flex; padding:0; overflow:hidden; }
      .project-open { min-width:0; flex:1; text-align:left; border:0; border-radius:0; background:transparent; padding:9px 10px; }
      .project-open .name { display:block; font-size:12.5px; }
      .project [data-action="remove"] { border:0; border-left:1px solid #2b3850; border-radius:0; background:transparent; padding:0 9px; }
      .project .progress { display:block; height:2px; }
      html, body { height:100%; }
      body { display:flex; flex-direction:column; }
      main, .layout, .work, #workspace { min-height:0; flex:1; height:100%; }
      .work { padding:0; min-width:0; }
      .workspace-split { height:100%; display:grid; grid-template-columns:minmax(0,46%) minmax(0,54%); min-height:0; }
      .workspace-left { min-height:0; min-width:0; display:flex; flex-direction:column; gap:10px; padding:12px; border-right:1px solid #263148; }
      .video-center { flex:0 1 auto; min-height:0; display:flex; align-items:flex-start; justify-content:center; }
      #video-frame { width:100%; aspect-ratio:16/9; max-height:100%; position:relative; background:#05080e; border-radius:10px; overflow:hidden; }
      .player { width:100%; height:100%; aspect-ratio:auto; display:block; border-radius:0; }
      #project-content { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:auto; }
      .editor { min-height:0; flex:1; overflow:auto; }
      .subtitle-table { min-width:0; }
      .number-col { width:34px; } .time-col { width:100px; }
      .cue textarea { min-height:50px; padding:7px 8px; font-size:12.5px; }
      .cue input { padding:5px; font-size:11px; }
      .subtitle-table td { padding:6px; } .subtitle-table th { padding:8px; font-size:11px; }
      .project-top { display:flex; align-items:center; gap:9px; min-width:0; }
      .project-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
      .export-group { margin-left:auto; display:flex; align-items:center; gap:5px; }
      .workspace-meta { font-size:11px; color:#94a3b8; margin-top:10px; }
      #workspace-controls button { padding:6px 9px; font-size:12px; }
      .library { height:100%; }
      @media (max-width:1279px) {
        .workspace-split { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
        .workspace-left { border-right:0; border-bottom:1px solid #263148; }
        .video-center { flex:none; }
        #video-frame { width:auto; height:min(36vh, 360px); max-width:100%; }
        .project-title { max-width:20ch; }
      }
      .source-picker { padding:16px; overflow:auto; min-height:0; }
      .source-picker h2 { font-size:15px; margin:0 0 10px; }
      .source-cta { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
      .source-note { font-size:12px; color:#94a3b8; }
      .source-group { margin:14px 0; }
      .source-group h3 { margin:0 0 6px; font-size:11px; color:#9baac2; font-weight:600; }
      .source-option { display:flex; gap:9px; align-items:center; padding:8px 10px; margin-bottom:5px; border:1px solid #2b3850; border-radius:8px; background:#111a2b; font-size:12.5px; cursor:pointer; }
      .source-option:has(input:checked) { border-color:#57b5fa; background:#203451; }
      .source-option input { accent-color:#57b5fa; }
      .source-picker .subtitle-preview { border:0; border-top:1px solid #2b3850; border-radius:0; padding:12px 0; }
      .audio-details { border:1px solid #2b3850; border-radius:8px; background:#101a2b; font-size:12px; }
      .audio-details summary { cursor:pointer; padding:7px 10px; color:#aebdd4; }
      .audio-options { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:0 10px 8px; }
      #asr-options { padding:8px 10px; font-size:12px; color:#aebdd4; }
      #asr-options select { background:#0d172a; color:#e8edf7; border:1px solid #314057; border-radius:6px; padding:5px; }
      #asr-options p { margin:7px 0 0; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <button id="library-toggle" aria-label="Mostrar biblioteca" aria-expanded="false">☰</button>
      <span class="brand">▣</span>
      <div id="project-header"></div>
      <span class="badge">● Local</span>
      <button class="primary" id="open-local">Abrir archivo local</button>
    </header>
    <main><div class="layout">
      <aside class="panel library">
        <div class="list" id="projects">Cargando...</div>
        <div class="library-footer">
          <button id="show-trash">Papelera</button>
          <button id="clear-library">Vaciar biblioteca</button>
          <button id="restore-library" hidden>Restaurar todo</button>
        </div>
      </aside>
      <section class="work"><div id="workspace"><div class="empty">Abre un archivo local o selecciona un proyecto.</div></div></section>
    </div></main>
    <script src="/editor-state.js" defer></script>
    <script src="/app.js?v=ux-phase2-asr" defer></script>
    <script src="/library.js?v=outside-click" defer></script>
    <script src="/sources.js?v=ux-phase2-asr" defer></script>
  </body>
</html>
