services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
  api:
    build: ./backend
    environment: &settings
      DATABASE_URL: postgresql+psycopg://subtitles:${DB_PASSWORD}@db:5432/subtitles
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      MAC_URL: http://host.docker.internal:8765
      MAC_TOKEN: ${MAC_TOKEN}
    volumes: ["./data:/data"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *settings
    volumes: ["./data:/data"]
    depends_on: [db, redis]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: subtitles
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: subtitles
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
